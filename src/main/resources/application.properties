# Server configuration
server.port=8080
# Bind to 0.0.0.0 so external devices (Android mobile/emulator) on the same Wi-Fi can connect
server.address=0.0.0.0

# Application Details
spring.application.name=skillsync-backend

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:skillsyncdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload configuration (support PDF resumes up to 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Swagger OpenAPI docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

